<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新建任务 · 定时动作</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
textarea{font:inherit;color:inherit}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5E6064; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">
  <a href="Tasks.dc.html" aria-label="关闭" style="position: absolute; left: 0; right: 0; top: 0; height: 90px"></a>

  <section role="dialog" aria-label="新建" style="position: absolute; left: 0; right: 0; bottom: 0; top: 80px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 24px 24px 0 0">
    <div style="flex: none; display: flex; justify-content: center; padding: 8px 0 4px"><span style="width: 36px; height: 4px; border-radius: 2px; background: #D4D4CD"></span></div>
    <div style="flex: none; padding: 6px 16px 14px">
      <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 14px; background: #EBEBE5">
        <button role="tab" aria-selected="false" style="height: 38px; border-radius: 11px; font-size: 14px; color: #5C6169">任务</button>
        <button role="tab" aria-selected="true" style="height: 38px; border-radius: 11px; font-size: 14px; font-weight: 600; background: #FFFFFF; box-shadow: 0 1px 2px rgba(21,23,26,.1)">定时动作</button>
      </div>
    </div>

    <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 20px 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #5C6169">什么时候</span>
        <div role="radiogroup" style="display: flex; flex-wrap: wrap; gap: 8px">
          <button role="radio" aria-checked="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D4D4CD; font-size: 14px">10 分钟后</button>
          <button role="radio" aria-checked="true" style="height: 38px; padding: 0 14px; border-radius: 19px; background: #15171A; color: #FFFFFF; font-size: 14px; font-weight: 500">1 小时后</button>
          <button role="radio" aria-checked="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D4D4CD; font-size: 14px">明天 09:00</button>
          <button role="radio" aria-checked="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #D4D4CD; font-size: 14px">自定义…</button>
        </div>
        <span style="font-size: 12px; color: #5C6169">将在今天 11:52 触发</span>
      </div>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #5C6169">发给</span>
        <span style="height: 48px; padding: 0 12px 0 6px; border-radius: 12px; border: 1px solid #D4D4CD; display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 32px; height: 32px; border-radius: 9px; background: #4F46E5; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span><span style="flex: 1">builder</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </label>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #5C6169">提醒内容</span>
        <textarea rows="3" style="resize: none; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #0F766E; font-size: 15px; line-height: 22px; outline: 0">检查发布流水线结果，失败的话把日志贴到频道</textarea>
      </label>

      <details style="border-radius: 12px; border: 1px solid #E5E5E0; padding: 12px 14px">
        <summary style="font-size: 14px; color: #3B3F46; cursor: pointer">高级：消息类型与 JSON 负载</summary>
      </details>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #5C6169">本次会话已安排</span>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 14px; border-radius: 12px; background: #F6F6F2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">提醒 planner 汇总清单</span><span style="font-size: 12px; color: #5C6169">今天 14:00 · 已安排</span></span>
          <button style="height: 36px; padding: 0 10px; font-size: 13px; color: #B42318">取消</button>
        </div>
      </div>
    </main>

    <div style="flex: none; padding: 12px 16px 16px; border-top: 1px solid #E5E5E0">
      <button style="width: 100%; height: 50px; border-radius: 14px; background: #15171A; color: #FFFFFF; font-size: 16px; font-weight: 600">安排定时动作</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
