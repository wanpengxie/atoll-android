<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>注册</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
@keyframes atollSpin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif; padding: 8px 24px 24px">

  <a href="Login.dc.html" aria-label="返回登录" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #15171A">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px; margin: 16px 0 28px">
    <h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700">创建账号</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #5C6169">注册后需要空间管理员准入，才能加入频道。</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3B3F46">服务器地址</span>
      <input type="url" value="https://[节点地址]" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D4D4CD; background: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 15px; outline: 0">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3B3F46">邮箱</span>
      <input type="email" placeholder="name@example.com" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D4D4CD; background: #FFFFFF; font-size: 16px; outline: 0">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3B3F46">显示名 <span style="font-weight: 400; color: #5C6169">（可选）</span></span>
      <input placeholder="其他成员看到的名字" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D4D4CD; background: #FFFFFF; font-size: 16px; outline: 0">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #3B3F46">密码</span>
      <input type="password" style="height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D4D4CD; background: #FFFFFF; font-size: 16px; outline: 0">
    </label>
    <button type="button" disabled style="margin-top: 8px; height: 54px; border-radius: 16px; background: #15171A; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; opacity: .85">
      <span style="width: 16px; height: 16px; border-radius: 8px; border: 2px solid rgba(255,255,255,.35); border-top-color: #FFFFFF; box-sizing: border-box; animation: atollSpin .9s linear infinite"></span>正在创建…
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
