<!doctype html>

<head>

<x-dc>
<helmet>

<style>

button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
@keyframes atollCaret{50%{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: #FFFFFF; border-bottom: 1px solid #E5E5E0">
    <a href="Main.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; font-size: 17px; font-weight: 600"><span style="color: #8B9097; font-weight: 500">#</span> atoll-web</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding: 0 16px 12px; opacity: .35">
    <div style="display: flex; gap: 12px"><span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #4F46E5"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="width: 120px; height: 12px; border-radius: 6px; background: #C9C9C2"></span><span style="height: 12px; border-radius: 6px; background: #D4D4CD"></span><span style="width: 70%; height: 12px; border-radius: 6px; background: #D4D4CD"></span></span></div>
  </main>

  <section aria-label="提及成员" style="flex: none; margin: 0 8px 8px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E5E5E0; box-shadow: 0 10px 30px rgba(21,23,26,.12); overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; font-size: 12px; font-weight: 600; color: #5C6169">提及成员<span style="font-weight: 400">匹配 “re” · 2</span></div>
    <ul role="listbox" style="list-style: none; margin: 0; padding: 0 6px 6px">
      <li role="option" aria-selected="true" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 14px; background: #F1F1EC">
        <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #FBF1DF; color: #8A4B00; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600"><span style="color: #0F766E">re</span>viewer</span>
          <span style="font-size: 12px; color: #5C6169">Agent · 代码审查 · 空闲</span>
        </span>
        <span style="font-size: 12px; color: #5C6169; padding: 2px 6px; border-radius: 6px; border: 1px solid #D4D4CD">最近</span>
      </li>
      <li role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 14px">
        <span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #FCECEA; color: #9F1F14; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600"><span style="color: #0F766E">re</span>lease-bot</span>
          <span style="font-size: 12px; color: #5C6169">工具 · 发布流水线 · 不在此频道</span>
        </span>
        <span style="font-size: 12px; color: #8A4B00">需邀请</span>
      </li>
    </ul>
    <div style="display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid #E5E5E0; overflow: hidden">
      <span style="font-size: 12px; color: #5C6169; align-self: center; flex: none">其他：</span>
      <button style="height: 32px; flex: none; padding: 0 10px; border-radius: 16px; border: 1px solid #D4D4CD; font-size: 13px">builder</button>
      <button style="height: 32px; flex: none; padding: 0 10px; border-radius: 16px; border: 1px solid #D4D4CD; font-size: 13px">planner</button>
      <button style="height: 32px; flex: none; padding: 0 10px; border-radius: 16px; border: 1px solid #D4D4CD; font-size: 13px">所有 Agent</button>
    </div>
  </section>

  <div style="flex: none; margin: 0 8px 10px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #15171A">
    <div role="textbox" aria-label="发送消息" style="padding: 12px 16px 6px; font-size: 16px; line-height: 23px">请 @re<span style="display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: #0F766E; animation: atollCaret 1s steps(1) infinite"></span></div>
    <div style="display: flex; align-items: center; gap: 2px; padding: 4px 6px 6px">
      <a href="AgentPicker.dc.html" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; border-radius: 18px; background: #F1F1EC; color: #15171A; font-size: 13px">
        <span style="width: 26px; height: 26px; border-radius: 8px; background: #4F46E5; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>builder<span style="color: #5C6169">· 高</span>
      </a>
      <span style="flex: 1"></span>
      <button aria-label="添加附件" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #5C6169">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a2 2 0 0 1-2.8-2.8l7.9-7.9"></path></svg>
      </button>
      <button aria-label="发送" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: #15171A; color: #FFFFFF">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
