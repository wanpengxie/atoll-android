<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成员配置</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: #FFFFFF">
    <a href="Members.html" aria-label="返回成员" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; font-size: 17px; font-weight: 600">成员详情</span>
    <button aria-label="更多" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
  </header>

  <section style="flex: none; display: flex; align-items: center; gap: 14px; padding: 6px 20px 16px; background: #FFFFFF">
    <span style="width: 56px; height: 56px; flex: none; border-radius: 15px; background: #4F46E5; color: #FFFFFF; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 20px; font-weight: 700">builder</span>
      <span style="font-size: 13px; color: #5C6169">Agent · class <code style="font-family: 'Geist Mono', monospace">coder</code> · local-device</span>
      <span style="font-size: 12px; color: #1E7A4C; display: flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>构建成功 · 描述 v2 · 配置 v5</span>
    </span>
  </section>

  <div role="tablist" style="flex: none; display: flex; gap: 22px; padding: 0 20px; height: 42px; background: #FFFFFF; border-bottom: 1px solid #E5E5E0">
    <button role="tab" aria-selected="true" style="font-size: 14px; font-weight: 600; border-bottom: 2px solid #15171A; margin-bottom: -1px">配置</button>
    <button role="tab" aria-selected="false" style="font-size: 14px; color: #5C6169">描述</button>
    <button role="tab" aria-selected="false" style="font-size: 14px; color: #5C6169">能力</button>
    <button role="tab" aria-selected="false" style="font-size: 14px; color: #5C6169">JSON</button>
  </div>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px">
    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FBF1DF; font-size: 13px; line-height: 19px; color: #5A3A05">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      <span>引用的全局 key <code style="font-family: 'Geist Mono', monospace">deploy_token</code> 不存在。<a href="SpaceAdmin.html" style="font-weight: 600; color: #6B3A00; text-decoration: underline">去空间管理添加</a></span>
    </div>

    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA">
        <span style="font-size: 15px">模型</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 14px">[模型名]<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA">
        <span style="font-size: 15px">默认推理强度</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px">高<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-bottom: 1px solid #EFEFEA">
        <span style="display: flex; justify-content: space-between; font-size: 15px">提供方密钥<span style="font-size: 12px; color: #0F5F59; padding: 2px 6px; border-radius: 6px; background: #E2F1EE">引用全局 key</span></span>
        <input value="$global.provider_key" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #D4D4CD; font-family: 'Geist Mono', monospace; font-size: 14px; outline: 0">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px">
        <span style="font-size: 15px">部署令牌</span>
        <input value="$global.deploy_token" aria-invalid="true" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #B42318; font-family: 'Geist Mono', monospace; font-size: 14px; outline: 0">
        <span style="font-size: 12px; color: #9F1F14">这个 key 现在还没有值</span>
      </label>
    </div>

    <details style="border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5E0; padding: 12px 14px">
      <summary style="font-size: 14px; font-weight: 500; cursor: pointer">将提交的变更 · 1 处</summary>
    </details>
  </main>

  <div style="flex: none; display: flex; gap: 8px; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E5E5E0">
    <button style="height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid #D4D4CD; font-size: 15px; font-weight: 500">重启</button>
    <button style="flex: 1; height: 48px; border-radius: 12px; background: #15171A; color: #FFFFFF; font-size: 15px; font-weight: 600">保存配置</button>
  </div>
</div>
</div>

</body>
</html>
