<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我 · 设置</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="flex: none; padding: 12px 20px 12px">
    <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">我</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 12px">
    <section style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E5E5E0">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 26px; background: #15171A; color: #FFFFFF; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">W</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 600">[显示名]</span>
        <span style="font-size: 13px; color: #5C6169; font-family: 'Geist Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">user:[账号] · 空间管理员</span>
      </span>
    </section>

    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">

    </ul>

    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">

      <li><a href="Upgrade.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; color: #15171A"><span style="flex: 1; font-size: 15px">节点版本</span><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #E2F1EE; color: #0F5F59; font-size: 12px; font-weight: 500; display: flex; align-items: center">可升级</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a></li>
    </ul>

    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA">
        <span style="flex: 1; font-size: 15px">终端深色主题</span>
        <button role="switch" aria-checked="true" aria-label="终端深色主题" style="width: 48px; height: 28px; border-radius: 14px; background: #0F766E; position: relative"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.2)"></span></button>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">导出诊断</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px">导出性能记录</span><span style="font-size: 12px; color: #5C6169">保存到 # atoll-web 的频道文件</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg></li>
    </ul>

    <a href="Login.html" style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; display: flex; align-items: center; justify-content: center; color: #B42318; font-size: 15px; font-weight: 500">退出当前账号</a>
  </main>

  <nav aria-label="主导航" style="flex: none; height: 68px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E5E5E0">
    <a href="Channels.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5C6169; font-size: 12px">
      <span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"></path></svg></span>频道
    </a>
    <a href="Activity.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5C6169; font-size: 12px">
      <span style="position: relative; width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"></path></svg><span style="position: absolute; top: 1px; right: 10px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #B42318; color: #FFFFFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></span>活动
    </a>
    <a href="Settings.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #15171A; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 30px; border-radius: 15px; background: #E2F1EE; color: #0F5F59; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg></span>我
    </a>
