<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新建频道</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px">
    <a href="Channels.html" aria-label="关闭" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="flex: 1; font-size: 17px; font-weight: 600">新建频道</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 16px">
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #5C6169">起点</legend>
      <div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: 14px; border: 1.5px solid #15171A; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path></svg>
          <span style="font-size: 14px; font-weight: 600">空白</span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: 14px; border: 1px solid #D4D4CD; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
          <span style="font-size: 14px; font-weight: 500">复制频道</span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: 14px; border: 1px solid #D4D4CD; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"></circle><path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19"></path></svg>
          <span style="font-size: 14px; font-weight: 500">挑选成员</span>
        </button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #5C6169">父频道</span>
      <span style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #D4D4CD; display: flex; align-items: center; justify-content: space-between; font-size: 15px"><span><span style="color: #8B9097">#</span> atoll</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C6169" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #5C6169">频道名称</span>
      <span style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #0F766E; display: flex; align-items: center; gap: 4px"><span style="color: #8B9097; font-size: 15px">#</span><input value="release-1-4" style="flex: 1; min-width: 0; border: 0; outline: 0; font-size: 15px"></span>
      <span style="font-size: 12px; color: #5C6169">1–64 位小写字母、数字、下划线或连字符</span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #5C6169">说明（可选）</span>
      <textarea rows="2" placeholder="这个频道用来做什么" style="resize: none; padding: 12px 14px; border-radius: 12px; border: 1px solid #D4D4CD; font-size: 15px; line-height: 22px; outline: 0"></textarea>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5C6169">带进来的成员</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; border-radius: 18px; background: #F1F1EC; font-size: 14px"><span style="width: 28px; height: 28px; border-radius: 14px; background: #15171A; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">我</span>你 · 自动加入</span>
        <button aria-pressed="true" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; border-radius: 18px; background: #EEEDFC; border: 1px solid #C9C6F5; font-size: 14px; color: #3730A3"><span style="width: 28px; height: 28px; border-radius: 8px; background: #4F46E5; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>builder<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
        <button aria-pressed="false" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; border-radius: 18px; border: 1px solid #D4D4CD; font-size: 14px"><span style="width: 28px; height: 28px; border-radius: 8px; background: #FBF1DF; color: #8A4B00; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>reviewer</button>
        <button aria-pressed="false" style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; border-radius: 18px; border: 1px solid #D4D4CD; font-size: 14px"><span style="width: 28px; height: 28px; border-radius: 8px; background: #E2F1EE; color: #0F5F59; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span>planner</button>
      </div>
    </div>
  </main>

  <div style="flex: none; padding: 12px 16px 16px; border-top: 1px solid #E5E5E0; display: flex; flex-direction: column; gap: 10px">
    <ol aria-label="创建进度" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #5C6169">
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #E0E0DA"></span>账本确认</li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #E0E0DA"></span>频道可观察</li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #E0E0DA"></span>服务就绪</li>
    </ol>
    <button style="height: 50px; border-radius: 14px; background: #15171A; color: #FFFFFF; font-size: 16px; font-weight: 600">创建频道</button>
  </div>
</div>
</div>

</body>
</html>
