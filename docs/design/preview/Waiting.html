<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>等待区</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
textarea{font:inherit;color:inherit}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
@keyframes atollPulse{0%{box-shadow:0 0 0 0 rgba(29,95,209,.45)}70%{box-shadow:0 0 0 6px rgba(29,95,209,0)}100%{box-shadow:0 0 0 0 rgba(29,95,209,0)}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5E6064; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">
  <a href="Main.html" aria-label="收起等待区" style="position: absolute; left: 0; right: 0; top: 0; height: 200px"></a>

  <section role="dialog" aria-label="等待区" style="position: absolute; left: 0; right: 0; bottom: 0; top: 190px; display: flex; flex-direction: column; background: #F6F6F2; border-radius: 24px 24px 0 0">
    <div style="flex: none; display: flex; justify-content: center; padding: 8px 0 4px"><span style="width: 36px; height: 4px; border-radius: 2px; background: #D4D4CD"></span></div>
    <header style="flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 8px 6px 20px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 18px; font-weight: 600">等待区 · 3 条</h1>
        <span style="font-size: 13px; color: #5C6169">目标 Agent 忙碌时，消息在这里排队</span>
      </span>
      <a href="Main.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; color: #5C6169">收起</a>
    </header>

    <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 8px 12px 16px">

      <section style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
        <header style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-bottom: 1px solid #E5E5E0">
          <span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #4F46E5; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 600">builder · 2 条</span>
            <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #1D4FB0"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1D5FD1; animation: atollPulse 1.6s infinite"></span>本轮结束后依次发出</span>
          </span>
          <button style="height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 500">全部插入</button>
          <button aria-label="更多：取消 builder 全部" style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #5C6169"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
        </header>
        <div style="display: flex; gap: 10px; padding: 12px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 10px; background: #EBEBE5; font-size: 11px; font-weight: 600; color: #5C6169; display: flex; align-items: center; justify-content: center">1</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; font-size: 15px; line-height: 22px"><span style="color: #0F766E; font-weight: 500">@reviewer</span> 等 builder 改完帮我看一下 diff</p>
            <div style="display: flex; gap: 6px">
              <button style="height: 34px; padding: 0 12px; border-radius: 10px; background: #15171A; color: #FFFFFF; font-size: 13px; font-weight: 500">插入本轮</button>
              <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #D4D4CD; font-size: 13px">编辑</button>
              <button style="height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: #B42318">取消</button>
            </div>
          </div>
        </div>
        <div style="display: flex; gap: 10px; padding: 12px; border-top: 1px solid #E5E5E0; background: #FBFBF8">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 10px; background: #EBEBE5; font-size: 11px; font-weight: 600; color: #5C6169; display: flex; align-items: center; justify-content: center">2</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <label style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 600; color: #0F5F59">编辑中 · 发送前会再次确认</span>
              <textarea rows="2" style="resize: none; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #0F766E; background: #FFFFFF; font-size: 15px; line-height: 22px; outline: 0">测试通过后把 APK 上传到频道文件的 release 目录</textarea>
            </label>
            <div style="display: flex; gap: 6px">
              <button style="height: 34px; padding: 0 12px; border-radius: 10px; background: #0F766E; color: #FFFFFF; font-size: 13px; font-weight: 500">确认编辑</button>
              <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #D4D4CD; font-size: 13px">放弃修改</button>
            </div>
          </div>
        </div>
      </section>

      <section style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
        <header style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-bottom: 1px solid #E5E5E0">
          <span style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #E2F1EE; color: #0F5F59; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 600">planner · 1 条</span>
            <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #8A4B00"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>已暂停 · 恢复后发出</span>
          </span>
          <button style="height: 36px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 500">恢复</button>
        </header>
        <div style="display: flex; gap: 10px; padding: 12px">
          <span style="width: 20px; height: 20px; flex: none; border-radius: 10px; background: #EBEBE5; font-size: 11px; font-weight: 600; color: #5C6169; display: flex; align-items: center; justify-content: center">1</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <p style="margin: 0; font-size: 15px; line-height: 22px">把终端深色主题加入 1.4 发布清单</p>
            <div style="display: flex; gap: 6px">
              <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #D4D4CD; font-size: 13px">编辑</button>
              <button style="height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13px; color: #B42318">取消</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </section>
</div>
</div>

</body>
</html>
