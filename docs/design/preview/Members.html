<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>成员</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
@keyframes atollPulse{0%{box-shadow:0 0 0 0 rgba(29,95,209,.45)}70%{box-shadow:0 0 0 6px rgba(29,95,209,0)}100%{box-shadow:0 0 0 0 rgba(29,95,209,0)}}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: #FFFFFF">
    <a href="Channels.html" aria-label="返回频道列表" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 17px; font-weight: 600; line-height: 22px"><span style="color: #8B9097; font-weight: 500">#</span> atoll-web</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #5C6169"><span style="width: 6px; height: 6px; border-radius: 3px; background: #0F766E"></span>3 个 Agent 在线 · 1 个运行中</span>
    </span>
    <button aria-label="刷新名册" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg>
    </button>
    <a href="ChannelDetails.html" aria-label="频道菜单" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </a>
  </header>

  <nav aria-label="频道视图" style="height: 44px; flex: none; display: flex; align-items: stretch; gap: 22px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid #E5E5E0">
    <a href="Main.html" style="display: flex; align-items: center; font-size: 15px; color: #5C6169">动态</a>
    <a href="Tasks.html" style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #5C6169">任务<span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #FBF1DF; color: #8A4B00; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="Files.html" style="display: flex; align-items: center; font-size: 15px; color: #5C6169">文件</a>
    <a href="Members.html" aria-current="page" style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #15171A; border-bottom: 2px solid #15171A; margin-bottom: -1px">成员<span style="font-size: 12px; font-weight: 400; color: #5C6169">5</span></a>
  </nav>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 14px 12px 90px">
    <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #5C6169">Agent 与工具 · 4</h2>
    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
      <li>
        <a href="MemberConfig.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 14px; color: #15171A; border-bottom: 1px solid #EFEFEA">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">B</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">builder</span><span style="font-size: 12px; color: #5C6169; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">代码实现 · class coder</span></span>
          <span style="display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 12px; background: #E9F0FC; color: #1D4FB0; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 3px; background: #1D5FD1; animation: atollPulse 1.6s infinite"></span>运行中</span>
        </a>
      </li>
      <li>
        <a href="MemberConfig.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 14px; color: #15171A; border-bottom: 1px solid #EFEFEA">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #FBF1DF; color: #8A4B00; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">reviewer</span><span style="font-size: 12px; color: #5C6169">代码审查 · class reviewer</span></span>
          <span style="display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 12px; background: #E2F1EE; color: #0F5F59; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 3px; background: #0F766E"></span>就绪</span>
        </a>
      </li>
      <li>
        <a href="MemberConfig.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 14px; color: #15171A; border-bottom: 1px solid #EFEFEA">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #E2F1EE; color: #0F5F59; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">planner</span><span style="font-size: 12px; color: #5C6169">规划 · class planner</span></span>
          <span style="display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 12px; background: #E2F1EE; color: #0F5F59; font-size: 12px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 3px; background: #0F766E"></span>就绪</span>
        </a>
      </li>
      <li>
        <a href="MemberConfig.html" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 8px 12px 8px 14px; color: #15171A">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #EBEBE5; color: #5C6169; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">release-bot</span><span style="font-size: 12px; line-height: 17px; color: #9F1F14">构建失败 · 改配置或重启后才会再构建</span></span>
          <span style="display: flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 12px; background: #FCECEA; color: #B42318; font-size: 12px; font-weight: 500">已停止</span>
        </a>
      </li>
    </ul>

    <h2 style="margin: 10px 4px 0; font-size: 13px; font-weight: 600; color: #5C6169">人 · 2</h2>
    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-bottom: 1px solid #EFEFEA">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #15171A; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">我</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">你</span><span style="font-size: 12px; color: #5C6169">所有者</span></span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #E7E3F8; color: #3F3591; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">L</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">[成员名]</span><span style="font-size: 12px; color: #5C6169">参与者 · 在线</span></span>
      </li>
    </ul>
  </main>

  <button style="position: absolute; right: 16px; bottom: 20px; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 20px 0 16px; border-radius: 18px; background: #15171A; color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: 0 6px 20px rgba(21,23,26,.22)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>添加成员
  </button>
</div>
</div>

</body>
</html>
