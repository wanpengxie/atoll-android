<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>频道详情</title>

</head>
<body style="margin:0;background:#E9E9E4;display:flex;justify-content:center;padding:24px 0">
<div class="dc-root">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B5F58}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F6F6F2; color: #15171A; font-family: 'Geist', 'Noto Sans SC', system-ui, sans-serif">

  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 4px">
    <a href="Main.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #15171A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1"></span>
    <button style="height: 44px; padding: 0 14px; font-size: 15px; font-weight: 500; color: #0F766E">编辑</button>
  </header>

  <section style="flex: none; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700"><span style="color: #8B9097; font-weight: 500">#</span> atoll-web</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #3B3F46">Web 端与 Android 端的对齐工作，Agent 在这里实现、审查和发布。</p>
    <p style="margin: 0; font-size: 12px; color: #5C6169; font-family: 'Geist Mono', monospace">c0.atoll-web · 父级 # atoll</p>
  </section>

  <div style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 16px">
    <a href="Starred.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5E0; color: #15171A; font-size: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>星标
    </a>
    <a href="Starred.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5E0; color: #15171A; font-size: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>最近阅读
    </a>
    <a href="Schedule.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5E0; color: #15171A; font-size: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>定时动作
    </a>
    <a href="Terminal.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5E0; color: #15171A; font-size: 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect><path d="M7 10l3 2.5L7 15M12.5 15H17"></path></svg>终端
    </a>
  </div>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 12px">
    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">通知</span><span style="font-size: 14px; color: #5C6169">提及我和审批</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">设备</span><span style="font-size: 14px; color: #5C6169">local-device · 已挂载</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">子频道</span><span style="font-size: 14px; color: #5C6169">2</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></li>
      <li><a href="NewChannel.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; color: #0F766E; font-size: 15px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>新建子频道</a></li>
    </ul>

    <ul style="list-style: none; margin: 0; padding: 0; border-radius: 16px; background: #FFFFFF; border: 1px solid #E5E5E0; overflow: hidden">
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">后台任务</span><span style="font-size: 14px; color: #1D4FB0">2 个运行中</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EFEFEA"><span style="flex: 1; font-size: 15px">高级资源工具</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></li>
      <li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px"><span style="flex: 1; font-size: 15px">导出性能记录</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B9097" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"></path></svg></li>
    </ul>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <button disabled style="height: 44px; text-align: left; font-size: 15px; color: #8B9097">重启频道</button>
      <span style="font-size: 12px; color: #5C6169">节点暂不支持重启单个频道。</span>
    </div>
  </main>
</div>
</div>

</body>
</html>
